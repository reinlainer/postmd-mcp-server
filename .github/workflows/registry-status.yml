# 레지스트리에 올라간 버전의 상태를 바꾼다. 손으로 돌린다.
#
# 잘못 올린 버전을 정리하는 데 쓴다. 레지스트리는 semver 가 가장 높은 것을 최신으로 보므로,
# 실수로 올린 높은 번호를 그냥 두면 그것이 계속 최신으로 남는다.
#
# 인증은 발행과 같다. GitHub 이 발급하는 단기 OIDC 토큰이라 사람이 승인할 것이 없다.
name: registry-status

on:
  workflow_dispatch:
    inputs:
      version:
        description: '상태를 바꿀 버전 (예: 3.0.0)'
        required: true
      status:
        description: '바꿀 상태'
        required: true
        default: deleted
        type: choice
        options: [active, deprecated, deleted]
      message:
        description: '이유. 레지스트리에 함께 남는다'
        required: false
        default: ''

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set the version status
        run: |
          NAME=$(node -p "require('./server.json').name")
          ./mcp-publisher login github-oidc
          ./mcp-publisher status \
            --status "${{ inputs.status }}" \
            --message "${{ inputs.message }}" \
            "$NAME" "${{ inputs.version }}"
